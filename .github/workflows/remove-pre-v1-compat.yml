name: Remove pre-V1 compatibility

on:
  push:
    branches:
      - cleanup/remove-pre-v1-compatibility

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-pre-v1-compatibility
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Apply cleanup
        run: python .github/remove_pre_v1_compat.py

      - name: Format Go
        working-directory: orchestrator
        run: go fmt ./...

      - name: Test orchestrator
        working-directory: orchestrator
        run: go test ./...

      - name: Lint UI
        working-directory: ui
        run: |
          npm ci
          npm run lint

      - name: Check diff
        run: git diff --check

      - name: Commit cleanup
        run: |
          rm .github/remove_pre_v1_compat.py .github/workflows/remove-pre-v1-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove pre-V1 compatibility layers"
          git push origin HEAD:cleanup/remove-pre-v1-compatibility
