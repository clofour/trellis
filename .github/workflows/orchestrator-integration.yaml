name: orchestrator-integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  multi-node:
    name: multi-node-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - name: Run multi-node integration tests
        run: go test -tags=integration ./integration -count=1 -timeout=6m

  containerd:
    name: containerd-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - name: Start containerd
        run: |
          sudo systemctl start containerd
          sudo chmod 666 /run/containerd/containerd.sock

      - name: Run containerd allocation-adoption E2E
        run: go test -tags=containerd_e2e ./internal/runtime -run TestContainerdAllocationAdoption -count=1 -timeout=3m
