name: volume-model-fixup

on:
  push:
    branches: [volume-registration-model]

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: volume-registration-model
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
      - name: Remove legacy host-volume plumbing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('orchestrator/cmd/trellis/main.go')
          s = p.read_text()
          s = s.replace('\n\t"github.com/clofour/trellis/internal/spec"', '')
          s = s.replace('\n\tHostVolumes                                                []string', '')
          s = s.replace('\n\tf.StringArrayVar(&cfg.HostVolumes, "host-volume", nil, "Available named host volume in name=/absolute/path form (repeatable)")', '')
          s = re.sub(r'\n\tvolumeManager := agent\.NewVolumeManager\(cfg\.DataDir\)\n\tif len\(cfg\.HostVolumes\) > 0 \{.*?\n\t\}\n\tag :=', '\n\tvolumeManager := agent.NewVolumeManager(cfg.DataDir)\n\tag :=', s, flags=re.S)
          s = re.sub(r'\nfunc parseHostVolumes\(raw \[\]string\) \(map\[string\]string, error\) \{.*?\n\}\n\nfunc acquireNodeID', '\nfunc acquireNodeID', s, flags=re.S)
          p.write_text(s)

          p = Path('orchestrator/cmd/trellis/config.go')
          s = p.read_text()
          s = s.replace('\n\tHostVolumes       *[]string            `yaml:"host_volumes"`', '')
          s = re.sub(r'\n\tif parsed\.HostVolumes != nil && !flags\.Changed\("host-volume"\) \{\n\t\tcfg\.HostVolumes = append\(\[\]string\(nil\), \(\*parsed\.HostVolumes\)\.\.\.\)\n\t\}', '', s)
          p.write_text(s)

          p = Path('orchestrator/cmd/trellis/config_test.go')
          s = p.read_text()
          s = s.replace('host_volumes:\n  - data=/srv/data\n', '')
          s = s.replace('if len(cfg.Labels) != 1 || cfg.Labels[0] != "storage=fast" || len(cfg.HostVolumes) != 1 || cfg.HostVolumes[0] != "data=/srv/data" {\n\t\tt.Fatalf("unexpected lists: labels=%v volumes=%v", cfg.Labels, cfg.HostVolumes)\n\t}', 'if len(cfg.Labels) != 1 || cfg.Labels[0] != "storage=fast" {\n\t\tt.Fatalf("unexpected labels: %v", cfg.Labels)\n\t}')
          p.write_text(s)
          PY
          gofmt -w orchestrator/cmd/trellis/main.go orchestrator/cmd/trellis/config.go orchestrator/cmd/trellis/config_test.go orchestrator/internal/agent/volumes.go orchestrator/internal/agent/volumes_test.go orchestrator/internal/server/scheduler.go orchestrator/internal/server/scheduler_test.go orchestrator/internal/spec/types.go orchestrator/internal/spec/validate.go orchestrator/internal/specschema/schema.go
      - name: Regenerate schemas
        working-directory: orchestrator
        run: go run ./cmd/generate-schemas
      - name: Sync dashboard schema
        run: cp schemas/trellis-job.schema.json ui/public/trellis-job.schema.json
      - name: Run Go tests
        working-directory: orchestrator
        run: go test ./...
      - name: Commit generated fixups
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/cmd/trellis/main.go orchestrator/cmd/trellis/config.go orchestrator/cmd/trellis/config_test.go orchestrator/internal/agent/volumes.go orchestrator/internal/agent/volumes_test.go orchestrator/internal/server/scheduler.go orchestrator/internal/server/scheduler_test.go orchestrator/internal/spec/types.go orchestrator/internal/spec/validate.go orchestrator/internal/specschema/schema.go schemas/trellis-job.schema.json schemas/trellis-job-api.schema.json ui/public/trellis-job.schema.json
          git commit -m "chore: finalize volume model migration"
          git push origin HEAD:volume-registration-model
