name: secrets-demo
namespace: default
task_groups:
  - name: reader
    count: 1
    tasks:
      - name: app
        image: docker.io/library/nginx:1.27-alpine
        env:
          MESSAGE: secrets are mounted at runtime
        secrets:
          - name: api-token
            target: env
            env: API_TOKEN
          - name: tls-key
            target: file
            path: /run/trellis-secrets/tls.key
            mode: 256
