namespace: acme
name: api
task_groups:
  - name: server
    count: 2
    tasks:
      - name: server
        image: your-registry/api:latest
        resources:
          cpu: 250
          memory: 134217728
        ports:
          - host_port: 0
            container_port: 8080
        health_check:
          type: http
          port: 8080
          path: /health
        secrets:
          # Inject the database password as an environment variable.
          - name: db-password
            target: env
            env: DB_PASSWORD

          # Mount the TLS certificate as a file inside the container.
          - name: tls-cert
            target: file
            path: /run/secrets/tls.crt
            mode: 0400
