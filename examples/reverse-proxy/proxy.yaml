namespace: acme
name: reverse-proxy
task_groups:
  - name: proxy
    count: 1
    network_mode: host
    api_access: true
    tasks:
      - name: nginx
        image: docker.io/library/nginx:alpine
        resources:
          cpu: 250
          memory: 134217728
        ports:
          - host_port: 80
            container_port: 80
        health_check:
          type: http
          port: 80
          path: /health
