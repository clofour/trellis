namespace: acme
name: pg-1
task_groups:
  - name: postgres
    count: 1
    network_mode: host
    constraints:
      - attribute: pg-node
        value: "1"
    tasks:
      - name: postgres
        image: ghcr.io/zalando/spilo-16:3.2-p1
        resources:
          cpu: 2000
          memory: 2147483648
        health_check:
          type: http
          port: 8008
          path: /health
        env:
          # Cluster identity — must be identical across all three pg-N jobs.
          SCOPE: pg-cluster
          PATRONI_NAME: pg-1

          # Etcd DCS — resolved via Trellis DNS.
          ETCD_HOSTS: etcd.acme.trellis:2379

          # PostgreSQL: listen on all interfaces; advertise via Trellis DNS.
          # pg-1 has count:1 and is pinned to one node, so pg-1.acme.trellis
          # always resolves to this allocation's address.
          PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
          PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1.acme.trellis:5432

          # Patroni REST API.
          PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
          PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1.acme.trellis:8008
        secrets:
          - name: pg-superuser-password
            target: env
            env: PGPASSWORD_SUPERUSER
          - name: pg-replication-password
            target: env
            env: PGPASSWORD_REPLICATION
        volumes:
          - name: pgdata
            path: /home/postgres/pgdata
