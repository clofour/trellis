namespace: acme
name: etcd
task_groups:
  - name: etcd
    count: 1
    network_mode: host
    constraints:
      - attribute: pg-node
        value: "1"
    tasks:
      - name: etcd
        image: bitnami/etcd:3.5
        resources:
          cpu: 500
          memory: 536870912
        health_check:
          type: tcp
          port: 2379
        env:
          # Single-node etcd for the Patroni DCS.
          # Replace 10.0.1.10 with the actual IP of the node labelled pg-node=1.
          ALLOW_NONE_AUTHENTICATION: "yes"
          ETCD_NAME: etcd-1
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://10.0.1.10:2379
        volumes:
          - name: etcd-data
            path: /bitnami/etcd
