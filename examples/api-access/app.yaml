namespace: acme
name: dashboard
task_groups:
  - name: web
    count: 2
    api_access: true
    tasks:
      - name: web
        image: your-registry/dashboard:latest
        resources:
          cpu: 250
          memory: 134217728
        ports:
          - host_port: 0
            container_port: 8080
        health_check:
          type: http
          port: 8080
          path: /health
