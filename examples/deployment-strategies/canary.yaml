name: shop-canary
namespace: default
task_groups:
  - name: web
    count: 1
    labels: {route: shop-weighted, track: canary, trellis/weight: "5"}
    tasks:
      - name: web
        image: docker.io/library/nginx:1.27-alpine
        ports: [{host_port: 0, container_port: 80}]
        health_check: {type: http, port: 80, path: /}
