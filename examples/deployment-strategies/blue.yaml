name: shop-blue
namespace: default
task_groups:
  - name: web
    count: 3
    labels: {route: shop-blue, color: blue}
    tasks:
      - name: web
        image: docker.io/library/nginx:1.26-alpine
        ports: [{host_port: 0, container_port: 80}]
        health_check: {type: http, port: 80, path: /}
