name: shop-green
namespace: default
task_groups:
  - name: web
    count: 3
    labels: {route: shop-green, color: green}
    tasks:
      - name: web
        image: docker.io/library/nginx:1.27-alpine
        ports: [{host_port: 0, container_port: 80}]
        health_check: {type: http, port: 80, path: /}
