namespace: acme
name: api
task_groups:
  - name: server
    count: 3
    tasks:
      # Primary application container.
      - name: app
        image: your-registry/api:latest
        resources:
          cpu: 500
          memory: 268435456
        ports:
          - host_port: 0
            container_port: 8080
        health_check:
          type: http
          port: 8080
          path: /health
        env:
          LOG_DIR: /var/log/api
        volumes:
          - name: logs
            path: /var/log/api

      # Log-shipping sidecar — runs alongside the app on the same host.
      # Both tasks share the same allocation and can communicate over
      # localhost or via shared volumes.
      - name: log-shipper
        image: fluent/fluent-bit:3
        resources:
          cpu: 50
          memory: 33554432
        env:
          FLB_LOG_LEVEL: info
        volumes:
          - name: logs
            path: /var/log/api
            read_only: true
