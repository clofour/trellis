namespace: acme
name: api
task_groups:
  - name: server
    # This example uses a single replica because both tasks intentionally mount
    # the same operator-provided host volume. For replicated workloads, give
    # each replica an appropriate shared-storage design instead of sharing one
    # host directory across every replica.
    count: 1
    tasks:
      # Primary application container.
      - name: app
        image: your-registry/api:latest
        resources:
          cpu: 500
          memory: 268435456
        ports:
          - host_port: 0
            container_port: 8080
        health_check:
          type: http
          port: 8080
          path: /health
        env:
          LOG_DIR: /var/log/api
        volumes:
          - name: logs
            path: /var/log/api
            host_volume: api-logs

      # Log-shipping sidecar — colocated with the app on the same node and
      # reading the same explicitly configured host volume.
      - name: log-shipper
        image: fluent/fluent-bit:3
        resources:
          cpu: 50
          memory: 33554432
        env:
          FLB_LOG_LEVEL: info
        volumes:
          - name: logs
            path: /var/log/api
            host_volume: api-logs
            read_only: true
