name: web-service
namespace: default
task_groups:
  - name: web
    count: 2
    update:
      strategy: rolling
      max_parallel: 1
    tasks:
      - name: nginx
        image: docker.io/library/nginx:1.27-alpine
        networking:
          mode: host
          ports:
            - host_port: 80
              container_port: 80
        resources:
          cpu: 100
          memory: 67108864
        health_check:
          type: http
          port: 80
          path: /
          interval: 5s
          timeout: 2s
          threshold: 2
