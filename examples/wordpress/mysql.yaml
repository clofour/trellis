namespace: blog
name: mysql
task_groups:
  - name: db
    count: 1
    tasks:
      - name: mysql
        image: docker.io/library/mysql:8
        env:
          MYSQL_ROOT_PASSWORD: trellis_demo
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        resources:
          cpu: 500
          memory: 536870912
        ports:
          - host_port: 0
            container_port: 3306
        volumes:
          - name: data
            path: /var/lib/mysql
        health_check:
          type: tcp
          port: 3306
