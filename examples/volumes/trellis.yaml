name: volumes-demo
namespace: default
task_groups:
  - name: writer
    count: 1
    constraints:
      - attribute: storage
        value: fast
    tasks:
      - name: app
        image: docker.io/library/nginx:1.27-alpine
        volumes:
          - name: scratch
            host_path: "@/scratch"
            container_path: /var/cache/app
          - name: database
            host_path: /srv/trellis/app-data
            container_path: /var/lib/app
